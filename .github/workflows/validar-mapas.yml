name: Validar cadastro com mapas
on:
  push:
    branches: [feat/mapas-reais-cadastro-motorista, feat/motor-encaixe-prazo-final]
  pull_request:
    branches: [feat/ideathon-finalizacao, feat/mapas-reais-cadastro-motorista]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
        if: always()
