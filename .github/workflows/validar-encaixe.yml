name: Validar motor de encaixe
on:
  pull_request:
    branches: [main, feat/ideathon-finalizacao]
  push:
    branches: [feat/encaixe-inteligente-ida-volta]
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
        if: always()
