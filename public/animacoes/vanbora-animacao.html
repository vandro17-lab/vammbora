<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VanBora — Animação</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  body.solid{background:#000}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* =====================================================================
   VanBora — projeto-fonte da animação (Canvas 2D, sem dependências)

   Parâmetros de URL:
     ?v=A            Versão A — busca inteligente (loop de 10 s)  [padrão]
     ?v=B            Versão B — abertura da marca (4,2 s, reprodução única)
     &bg=transparent fundo transparente (A: cidade com bordas esmaecidas)
     &loop=1         (apenas B) repete a abertura
   Toda a cena é função pura do tempo: window.renderAt(segundos).
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const VERSION = (Q.get('v') || 'A').toUpperCase();
const TRANSPARENT = Q.get('bg') === 'transparent';
const CAPTURE = Q.has('capture');
if (!TRANSPARENT) document.body.classList.add('solid');

const YEL = '#FFC700';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0;

/* ---------- utilidades ---------- */
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, t) => { t = clamp((t - a) / (b - a)); return t * t * (3 - 2 * t); };
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eoc = t => 1 - Math.pow(1 - clamp(t), 3);
const eoq = t => 1 - (1 - t) * (1 - t);
const eback = t => { t = clamp(t); const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const g = (v, k = 1) => { v = Math.round(clamp(v * k, 0, 255)); return `rgb(${v},${v},${v})`; };
const yel = (k = 1, a = 1) => `rgba(${Math.round(255 * k)},${Math.round(199 * k)},0,${a})`;

/* =====================================================================
   VERSÃO A — BUSCA INTELIGENTE
   ===================================================================== */
const T = 10;                       // duração do ciclo (s)
const PITCH = 7, BH = 2.5;          // quadra: 5 u; rua: 2 u
const HOME = [-0.7, -0.2];          // centro da residência (origem do radar)
const BEACON_Z = 4.0;
const RINGS = [                     // emissão (s), alcance máximo (u)
  { te: 1.10, R: 9.5 }, { te: 2.60, R: 15 }, { te: 4.10, R: 21 },
  { te: 5.60, R: 26 }, { te: 7.10, R: 26 }];
const RING_LIFE = 2.8;

let S = 30, CX = 0, CY = 0, camX = 0, camY = 0, camZ = 0, K = 1;
function P(x, y, z = 0) {
  return [CX + ((x - camX) - (y - camY)) * 0.866 * S,
          CY + ((x - camX) + (y - camY)) * 0.5 * S - (z - camZ) * S];
}
function poly(pts, fill, stroke, lw) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
}
function hull(pts) {
  pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const p of pts) { while (lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (up.length > 1 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
/* caixas alinhadas aos eixos: faces visíveis +x (direita, sombra), +y (esquerda, luz), topo */
function box(x0, y0, x1, y1, z0, z1, v) {
  poly([P(x1, y0, z0), P(x1, y1, z0), P(x1, y1, z1), P(x1, y0, z1)], g(v, .58));
  poly([P(x0, y1, z0), P(x1, y1, z0), P(x1, y1, z1), P(x0, y1, z1)], g(v, .82));
  poly([P(x0, y0, z1), P(x1, y0, z1), P(x1, y1, z1), P(x0, y1, z1)], g(v, 1));
}
const rectY = (x0, x1, y, z0, z1, f) => poly([P(x0, y, z0), P(x1, y, z0), P(x1, y, z1), P(x0, y, z1)], f);
const rectX = (x, y0, y1, z0, z1, f) => poly([P(x, y0, z0), P(x, y1, z0), P(x, y1, z1), P(x, y0, z1)], f);
function hipRoof(x0, y0, x1, y1, z, h, v) {
  const o = .13; x0 -= o; y0 -= o; x1 += o; y1 += o;
  const A = P(x0, y0, z), B = P(x1, y0, z), C = P(x1, y1, z), D = P(x0, y1, z);
  if (x1 - x0 >= y1 - y0) {
    const i = (y1 - y0) / 2, ym = (y0 + y1) / 2, R1 = P(x0 + i, ym, z + h), R2 = P(x1 - i, ym, z + h);
    poly([A, B, R2, R1], g(v, .72)); poly([A, D, R1], g(v, .97)); poly([B, C, R2], g(v, .6)); poly([D, C, R2, R1], g(v, .86));
  } else {
    const i = (x1 - x0) / 2, xm = (x0 + x1) / 2, R1 = P(xm, y0 + i, z + h), R2 = P(xm, y1 - i, z + h);
    poly([A, B, R1], g(v, .72)); poly([A, D, R2, R1], g(v, .97)); poly([B, C, R2, R1], g(v, .6)); poly([D, C, R2], g(v, .86));
  }
}
function shadowBox(x0, y0, x1, y1, h) {
  const dx = .55 * h, dy = -.3 * h;
  poly(hull([P(x0, y0), P(x1, y0), P(x1, y1), P(x0, y1), P(x0 + dx, y0 + dy), P(x1 + dx, y0 + dy), P(x1 + dx, y1 + dy), P(x0 + dx, y1 + dy)]), 'rgba(0,0,0,.36)');
}
function onFaceY(y, fn) { const o = P(0, y, 0); ctx.save(); ctx.setTransform(.866 * S, .5 * S, 0, -S, o[0], o[1]); fn(); ctx.restore(); }
function onFaceX(x, fn) { const o = P(x, 0, 0); ctx.save(); ctx.setTransform(-.866 * S, .5 * S, 0, -S, o[0], o[1]); fn(); ctx.restore(); }

function tree(x, y, sz, ph, t) {
  const sw = .035 * Math.sin(TAU * 2 * t / T + ph);
  const a = P(x, y, 0), b = P(x + sw * .4, y, .75 * sz);
  ctx.strokeStyle = g(34); ctx.lineWidth = Math.max(1, .07 * S); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  const c = P(x + sw, y - sw * .5, 1.15 * sz), r = .5 * sz * S;
  ctx.fillStyle = g(50); ctx.beginPath(); ctx.arc(c[0], c[1], r, 0, TAU); ctx.fill();
  ctx.fillStyle = g(66); ctx.beginPath(); ctx.arc(c[0] - r * .2, c[1] - r * .22, r * .72, 0, TAU); ctx.fill();
  ctx.fillStyle = g(84); ctx.beginPath(); ctx.arc(c[0] - r * .34, c[1] - r * .38, r * .38, 0, TAU); ctx.fill();
}
function treeShadow(x, y, sz) {
  const c = P(x + .5 * sz, y - .28 * sz, 0);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(c[0], c[1], .62 * sz * S, .34 * sz * S, 0, 0, TAU); ctx.fill();
}
function pole(x, y) {
  const a = P(x, y, 0), b = P(x, y, 2.1), c = P(x + .28, y + .28, 2.1);
  ctx.strokeStyle = g(92); ctx.lineWidth = Math.max(1, .045 * S); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.stroke();
  const r = .5 * S, gr = ctx.createRadialGradient(c[0], c[1], 0, c[0], c[1], r);
  gr.addColorStop(0, 'rgba(255,255,255,.55)'); gr.addColorStop(.18, 'rgba(255,255,255,.14)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(c[0], c[1], r, 0, TAU); ctx.fill();
}
const litLevel = (ph, t) => sstep(-.25, .25, Math.sin(TAU * t / T + ph));

/* ---------- cidade procedural ---------- */
const OBJ = [];      // {x,y,rad,key,draw(t),shadow()}
const POOLS = [];    // luz dos postes no chão
function buildCity() {
  for (let i = -8; i <= 8; i++) for (let j = -8; j <= 8; j++) {
    const bx = i * PITCH, by = j * PITCH, r = rng((i + 40) * 977 + (j + 40) * 131 + 7);
    const px = bx + 2.28, py = by + 2.28;
    OBJ.push({ x: px, y: py, rad: 3, key: px + py + .2, draw: () => pole(px, py), shadow() { } });
    POOLS.push([px + .3, py + .3]);
    if (i === 0 && j === 0) continue;
    for (const [qx, qy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      const cx = bx + qx * 1.12, cy = by + qy * 1.12, k = r();
      if (k < .17) {                                   // jardim / praça
        const ts = [[cx - .4, cy - .3, .8 + r() * .35, r() * 6], [cx + .45, cy + .35, .7 + r() * .3, r() * 6]];
        for (const a of ts) OBJ.push({ x: a[0], y: a[1], rad: 2, key: a[0] + a[1], draw: t => tree(a[0], a[1], a[2], a[3], t), shadow: () => treeShadow(a[0], a[1], a[2]) });
        continue;
      }
      const w = .68 + r() * .2, d = .62 + r() * .2;
      const two = r() < .2, h = two ? 1.75 : .88 + r() * .2, wall = 96 + r() * 44, roof = 58 + r() * 26;
      const kind = k < .3 ? 2 : (k < .52 ? 1 : 0);     // 2 comércio, 1 laje + caixa d'água, 0 telhado
      const x0 = cx - w, x1 = cx + w, y0 = cy - d, y1 = cy + d;
      const ph1 = r() * 6.28, ph2 = r() * 6.28, lit1 = r() < .55, lit2 = r() < .45, dyn = r() < .3, tx = r() < .5;
      OBJ.push({
        x: cx, y: cy, rad: 3.4, key: cx + cy,
        shadow: () => shadowBox(x0, y0, x1, y1, h + (kind === 0 ? .2 : 0)),
        draw(t) {
          box(x0, y0, x1, y1, 0, h, wall);
          const l1 = lit1 ? (dyn ? litLevel(ph1, t) : 1) : 0, l2 = lit2 ? (dyn ? litLevel(ph2, t) : 1) : 0;
          const wc = l => g(lerp(30, 225, l));
          if (kind === 2) {                             // vitrine + toldo
            rectY(x0 + .15, x1 - .15, y1, .12, .62, wc(.75));
            poly([P(x0 + .05, y1, .72), P(x1 - .05, y1, .72), P(x1 - .05, y1 + .3, .58), P(x0 + .05, y1 + .3, .58)], g(205));
            rectX(x1, y0 + .2, y1 - .2, .3, .68, wc(l2));
            box(x0 - .05, y0 - .05, x1 + .05, y1 + .05, h, h + .1, wall * .8);
          } else {
            rectY(x0 + .2, x0 + .62, y1, .34, .7, wc(l1));
            rectY(x1 - .5, x1 - .2, y1, 0, .64, g(wall * .42));
            rectX(x1, y0 + .28, y0 + .78, .34, .7, wc(l2));
            if (two) { rectY(x0 + .2, x1 - .25, y1, 1.08, 1.45, wc(l2)); rectX(x1, y0 + .28, y1 - .3, 1.08, 1.45, wc(l1)); }
            if (kind === 0) hipRoof(x0, y0, x1, y1, h, .46, roof);
            else {
              box(x0 - .06, y0 - .06, x1 + .06, y1 + .06, h, h + .09, wall * .78);
              const wx = tx ? x0 + .2 : x1 - .55, wy = y0 + .2;
              box(wx, wy, wx + .36, wy + .36, h + .09, h + .44, 168);
            }
          }
        }
      });
    }
    for (let n = 0; n < 2; n++) if (r() < .6) {          // árvores de calçada
      const side = r() < .5, o = (r() * 2 - 1) * 1.5;
      const tx = side ? bx + 2.25 : bx + o, ty = side ? by + o : by + 2.25, sz = .55 + r() * .2, ph = r() * 6;
      OBJ.push({ x: tx, y: ty, rad: 2, key: tx + ty, draw: t => tree(tx, ty, sz, ph, t), shadow: () => treeShadow(tx, ty, sz) });
    }
  }
  OBJ.push(homeObject());
}

/* ---------- residência central ---------- */
function homeObject() {
  const trees = [[-1.75, -1.7, 1.0, 1.2], [1.55, -1.6, .85, 3.1], [-1.75, 1.55, .7, 4.4], [1.6, 1.5, .62, .4]];
  return {
    x: 0, y: 0, rad: 6, key: 0,
    shadow() { shadowBox(-1.7, -1.3, 1.3, .9, 1.45); shadowBox(-1.7, -1.3, .3, .9, 2.87); for (const a of trees) treeShadow(a[0], a[1], a[2]); },
    draw(t) {
      tree(...trees[0], t); tree(...trees[1], t);
      // térreo
      box(-1.7, -1.3, 1.3, .9, 0, 1.45, 244);
      rectX(1.3, -1.05, .35, 0, 1.08, g(70));                                   // garagem
      for (let i = 1; i < 6; i++) { const z = i * .18, a = P(1.3, -1.05, z), b = P(1.3, .35, z); ctx.strokeStyle = g(46); ctx.lineWidth = Math.max(.6, .012 * S); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
      rectY(.62, 1.02, .9, 0, 1.08, g(42));                                     // porta
      rectY(.9, .95, .9, .5, .56, g(190));
      rectY(-1.4, .25, .9, .42, 1.1, g(52));                                    // janela térrea
      rectY(-1.36, .21, .9, .46, 1.06, g(150));
      rectY(-.6, -.56, .9, .46, 1.06, g(52));
      // piso superior
      box(-1.7, -1.3, .3, .9, 1.45, 2.75, 250);
      rectX(.3, -.9, .3, 1.5, 2.45, g(48)); rectX(.3, -.85, .25, 1.55, 2.4, g(120)); // porta do terraço
      drawWindowScene(t);
      // laje em balanço + placas solares
      box(-1.88, -1.48, .5, 1.12, 2.75, 2.87, 62);
      poly([P(-1.5, -1.1, 2.88), P(-.75, -1.1, 2.88), P(-.75, -.2, 2.88), P(-1.5, -.2, 2.88)], g(24), g(80), Math.max(.6, .015 * S));
      poly([P(-.6, -1.1, 2.88), P(.15, -1.1, 2.88), P(.15, -.2, 2.88), P(-.6, -.2, 2.88)], g(24), g(80), Math.max(.6, .015 * S));
      // guarda-corpo de vidro do terraço
      rectY(.3, 1.3, .9, 1.45, 1.82, 'rgba(255,255,255,.16)'); rectX(1.3, -1.3, .9, 1.45, 1.82, 'rgba(255,255,255,.10)');
      const r1 = P(.3, .9, 1.82), r2 = P(1.3, .9, 1.82), r3 = P(1.3, -1.3, 1.82);
      ctx.strokeStyle = g(215); ctx.lineWidth = Math.max(.8, .022 * S); ctx.beginPath(); ctx.moveTo(r1[0], r1[1]); ctx.lineTo(r2[0], r2[1]); ctx.lineTo(r3[0], r3[1]); ctx.stroke();
      // jardim frontal e muro baixo com portão
      tree(...trees[2], t); tree(...trees[3], t);
      box(2.06, -2.1, 2.14, 2.14, 0, .42, 205);
      box(-2.1, 2.06, .35, 2.14, 0, .42, 205); box(1.25, 2.06, 2.14, 2.14, 0, .42, 205);
      for (let i = 0; i <= 6; i++) { const x = .4 + i * .14, a = P(x, 2.1, 0), b = P(x, 2.1, .4); ctx.strokeStyle = g(120); ctx.lineWidth = Math.max(.6, .02 * S); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
    }
  };
}
/* janela aberta: pessoa com o celular, toque e brilho amarelo */
function drawWindowScene(t) {
  const u0 = -1.5, u1 = .1, v0 = 1.66, v1 = 2.58;
  const tap = sstep(.45, .8, t) * (1 - sstep(1.05, 1.5, t));          // dedo vai até a tela
  const flash = sstep(.8, .88, t) * (1 - sstep(.95, 1.9, t));         // clarão do toque
  const glow = .55 + .45 * flash + .06 * Math.sin(TAU * 3 * t / T);
  const bob = .012 * Math.sin(TAU * 2 * t / T);
  onFaceY(.9, () => {
    const px = 1 / S;
    ctx.fillStyle = g(38); ctx.fillRect(u0 - .05, v0 - .05, u1 - u0 + .1, v1 - v0 + .1);       // moldura
    ctx.beginPath(); ctx.rect(u0, v0, u1 - u0, v1 - v0); ctx.clip();
    const bgG = ctx.createLinearGradient(u0, v1, u1, v0); bgG.addColorStop(0, g(188)); bgG.addColorStop(1, g(126));
    ctx.fillStyle = bgG; ctx.fillRect(u0, v0, u1 - u0, v1 - v0);
    ctx.fillStyle = g(108); ctx.fillRect(u0, v0, .16, v1 - v0);                                   // folha de correr aberta
    ctx.fillStyle = g(160); ctx.fillRect(-.42, 2.2, .34, .24); ctx.fillStyle = g(205); ctx.fillRect(-.39, 2.23, .28, .18); // quadro
    ctx.strokeStyle = g(70); ctx.lineWidth = 1.2 * px; ctx.beginPath(); ctx.moveTo(-1.18, v1); ctx.lineTo(-1.18, 2.42); ctx.stroke();
    ctx.fillStyle = g(235); ctx.beginPath(); ctx.arc(-1.18, 2.4, .05, 0, TAU); ctx.fill();    // pendente
    // pessoa
    const cx = -.78, hy = 2.3 + bob;
    ctx.fillStyle = g(20);
    ctx.beginPath(); ctx.moveTo(cx - .27, v0 - .02); ctx.lineTo(cx - .25, 2.02); ctx.quadraticCurveTo(cx - .23, 2.14, cx - .08, 2.15);
    ctx.lineTo(cx + .08, 2.15); ctx.quadraticCurveTo(cx + .23, 2.14, cx + .25, 2.02); ctx.lineTo(cx + .27, v0 - .02); ctx.closePath(); ctx.fill();
    ctx.fillStyle = g(236); ctx.fillRect(cx - .04, 2.13, .08, .08);                               // pescoço
    ctx.beginPath(); ctx.arc(cx, hy, .115, 0, TAU); ctx.fill();                                   // cabeça
    ctx.fillStyle = g(14); ctx.beginPath(); ctx.arc(cx, hy + .02, .122, -.15, Math.PI + .15); ctx.closePath(); ctx.fill(); // cabelo
    // celular
    const phx = cx + .0, phy = 1.83, pw = .13, ph = .22;
    ctx.strokeStyle = g(236); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = .075;
    ctx.beginPath(); ctx.moveTo(cx - .22, 2.0); ctx.lineTo(cx - .2, 1.8); ctx.lineTo(phx - .03, phy + .03); ctx.stroke();      // braço que segura
    ctx.fillStyle = g(8); ctx.beginPath(); ctx.roundRect(phx - pw / 2, phy, pw, ph, .025); ctx.fill();
    ctx.fillStyle = yel(1, .75 + .25 * glow); ctx.beginPath(); ctx.roundRect(phx - pw / 2 + .014, phy + .016, pw - .028, ph - .032, .014); ctx.fill();
    const fx = lerp(cx + .26, phx + .02, tap), fy = lerp(1.78, phy + .12, tap);                   // braço que toca
    ctx.strokeStyle = g(236); ctx.lineWidth = .07;
    ctx.beginPath(); ctx.moveTo(cx + .22, 2.0); ctx.lineTo(cx + .25, 1.76); ctx.lineTo(fx, fy); ctx.stroke();
    // brilho do aparelho
    const gr = ctx.createRadialGradient(phx, phy + .12, 0, phx, phy + .12, .55);
    gr.addColorStop(0, yel(1, .5 * glow)); gr.addColorStop(.4, yel(1, .16 * glow)); gr.addColorStop(1, yel(1, 0));
    ctx.fillStyle = gr; ctx.fillRect(u0, v0, u1 - u0, v1 - v0);
    const rp = (t - .82) / .55;                                                                    // ondulação do toque
    if (rp > 0 && rp < 1) { ctx.strokeStyle = yel(1, (1 - rp) * .95); ctx.lineWidth = .022; ctx.beginPath(); ctx.arc(phx, phy + .12, .04 + .26 * eoq(rp), 0, TAU); ctx.stroke(); }
  });
  rectY(u0 - .08, u1 + .08, .9, v0 - .1, v0 - .04, g(205));                                       // peitoril
}

/* ---------- vans escolares ---------- */
function circuit(bx, by) {
  const a = 3.0, rc = .8, Ls = 2 * (a - rc), La = Math.PI * rc / 2, Pm = 4 * (Ls + La);
  const cc = [[bx + a - rc, by - a + rc], [bx + a - rc, by + a - rc], [bx - a + rc, by + a - rc], [bx - a + rc, by - a + rc]];
  return u => {
    let d = (((u % 1) + 1) % 1 * Pm + Ls / 2) % Pm;
    const k = Math.floor(d / (Ls + La)), e = d - k * (Ls + La), th0 = k * Math.PI / 2, c = cc[k], cp = cc[(k + 3) % 4];
    if (e < Ls) return { x: cp[0] + Math.sin(th0) * rc + Math.cos(th0) * e, y: cp[1] - Math.cos(th0) * rc + Math.sin(th0) * e, th: th0, d: u * Pm };
    const th = th0 + (e - Ls) / rc;
